<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Genesis Teleop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: monospace;
      color: #eee;
    }
    #stream {
      max-width: 100%;
      max-height: 90vh;
      border: 1px solid #333;
      background: #000;
    }
    #status {
      margin-top: 8px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <img id="stream" src="/stream" alt="simulator feed" />
  <div id="status">Connecting…</div>
  <script src="/client.js"></script>
</body>
</html>
