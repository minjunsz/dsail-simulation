<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Genesis Teleop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: monospace;
      color: #eee;
    }
    #video {
      max-width: 100%;
      max-height: 90vh;
      border: 1px solid #333;
      background: #000;
    }
    #status {
      margin-top: 8px;
      font-size: 13px;
      color: #aaa;
    }
    #status.unavailable {
      font-size: 24px;
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <div id="status">Connecting…</div>
  <script src="/client.js"></script>
  <script>
    // client.js owns signaling; this page-level observer handles server slot
    // messages without adding another client asset to the multi-user change.
    (() => {
      const watchedSockets = new WeakSet();

      function watchRobotSlot(ws) {
        if (!ws || watchedSockets.has(ws)) return;
        watchedSockets.add(ws);
        ws.addEventListener('message', event => {
          const data = JSON.parse(event.data);
          if (data.type === 'assigned') {
            document.title = `Genesis Teleop — Robot ${data.robot_id}`;
          } else if (data.type === 'no_robot') {
            keys.clear();
            video.pause();
            video.srcObject = null;
            video.hidden = true;
            statusEl.classList.add('unavailable');
            setStatus(data.message || 'No robot left');
          }
        });
      }

      // Observe the socket created by the initial connect() call, then wrap
      // connect so any later automatic retry receives the same handling.
      watchRobotSlot(activeWs);
      const originalConnect = connect;
      connect = function connectAndWatchRobotSlot() {
        originalConnect();
        watchRobotSlot(activeWs);
      };
    })();
  </script>
</body>
</html>
